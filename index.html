<style>
  :root{--ink:#2B1B4D;--cream:#FFF3D6;--gold:#FFB300;--red:#E53935;--teal:#1FA79A;--pink:#FF2E88}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;
    background:linear-gradient(#FFD59A,#FFB76B);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  .card{width:100%;max-width:440px;background:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);overflow:hidden;text-align:center}
  .band{height:14px;background:repeating-linear-gradient(135deg,var(--gold) 0 9px,var(--red) 9px 18px,var(--teal) 18px 27px,var(--pink) 27px 36px);border-bottom:3px solid var(--ink)}
  .in{padding:22px 22px 26px}
  .icon{width:120px;height:120px;border-radius:26px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:block;margin:4px auto 16px}
  h1{margin:0;font-size:28px;line-height:1.1;font-weight:800}
  .tag{margin:8px 0 20px;font-size:17px}
  .play{display:block;padding:14px 16px;background:var(--gold);color:var(--ink);text-decoration:none;font-weight:800;font-size:19px;
    border:3px solid var(--ink);border-radius:16px;box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 5.5px var(--red),0 4px 0 var(--ink)}
  .play:active{transform:translateY(3px);box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 5.5px var(--red),0 1px 0 var(--ink)}
  .note{font-size:13px;margin:10px 0 0;opacity:.8}
  ul{list-style:none;padding:0;margin:22px 0 0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
  ul a{color:var(--ink);font-weight:700}
  footer{margin-top:18px;font-size:13px;opacity:.85;text-align:center}
</style>
</head>
